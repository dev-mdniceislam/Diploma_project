name: diploma_job
description: "Diploma Career Hub - jobs and industrial attachment portal for diploma engineers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  internet_connection_checker_plus: ^3.1.1
  shimmer: ^4.0.0
  sqflite: ^2.4.2+1
  flutter_animate: ^4.5.2
  flutter_localization: ^0.4.1
  marquee: ^2.3.0
  carousel_slider: ^5.1.2
  photo_view: ^0.15.0
  fluttertoast: ^10.0.0
  visibility_detector: ^0.4.0+2
  flutter_staggered_grid_view: ^0.7.0
  overlay_support: ^2.1.0
  table_calendar: ^3.2.1
  file_picker: ^13.1.0
  jwt_decoder: ^2.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: englishFont
      fonts:
        - asset: assets/fonts/englishFont.ttf
    - family: bengaliFont
      fonts:
        - asset: assets/fonts/banglaFont.ttf
